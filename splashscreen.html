<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirje</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0c1222 0%, #151030 35%, #1a0a2e 65%, #0f172a 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .logo {
      width: 196px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards;
    }

    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #818cf8;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- Kirje logo — inline SVG, no external dependencies -->
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 96" fill="none" aria-label="Kirje">
    <g transform="translate(0 6) scale(0.16)">
      <rect x="21" y="21" width="470" height="470" rx="96" fill="#1E274D"/>
      <rect x="142" y="126" width="45" height="263" rx="15" fill="#F8F9F6"/>
      <path d="M212 145C212 134 221 126 232 126H356C365 126 369 137 363 143L284 224C273 235 259 248 240 248H232C221 248 212 239 212 228V145Z" fill="#F8F9F6"/>
      <path d="M279 256L376 148C384 139 389 144 389 157V355C389 368 384 373 376 364L279 256Z" fill="#F8F9F6"/>
      <path d="M212 293C212 282 221 274 232 274H240C258 274 273 287 284 298L363 379C369 385 365 389 356 389H232C221 389 212 380 212 369V293Z" fill="#F8F9F6"/>
    </g>
    <text x="104" y="61" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Kirje</text>
  </svg>

  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
